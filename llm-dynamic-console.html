<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIB34D AI Conductor Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at top left, rgba(0, 255, 200, 0.15), rgba(0, 0, 0, 0.95));
            color: #e0faff;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px;
            padding: 18px;
        }

        #visualizer-shell {
            position: relative;
            border: 2px solid rgba(0, 255, 255, 0.35);
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.75);
            box-shadow: 0 0 45px rgba(0, 255, 255, 0.12);
        }

        #visualizer-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .holographic-layers {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .holographic-layers canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: screen;
        }

        #console-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 2px solid rgba(0, 255, 255, 0.25);
            border-radius: 18px;
            padding: 18px;
            background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(16px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.08);
        }

        #console-panel h1 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            background: linear-gradient(90deg, #00faff, #8b5cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #state-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .state-chip {
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .state-chip span.value {
            font-size: 18px;
            color: #ffffff;
        }

        #conversation-log {
            flex: 1;
            background: rgba(8, 12, 20, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px;
            border-radius: 10px;
        }

        .message.user {
            background: rgba(139, 92, 255, 0.2);
            align-self: flex-end;
            border: 1px solid rgba(139, 92, 255, 0.4);
        }

        .message.system {
            background: rgba(0, 255, 255, 0.12);
            border: 1px solid rgba(0, 255, 255, 0.35);
        }

        .message .meta {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        #audio-insights {
            border: 1px solid rgba(0, 255, 255, 0.18);
            border-radius: 14px;
            padding: 14px;
            background: rgba(0, 28, 35, 0.45);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #audio-insights h2 {
            margin: 0;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #74f6ff;
        }

        #audio-source-tools {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #audio-upload {
            background: rgba(0, 255, 255, 0.08);
            border: 1px dashed rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 8px 12px;
            color: #aefbff;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1px;
        }

        #audio-player {
            width: 100%;
            border-radius: 10px;
            background: rgba(4, 12, 20, 0.65);
            border: 1px solid rgba(0, 255, 255, 0.15);
        }

        #audio-features {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .audio-feature {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
        }

        .audio-feature .label {
            display: flex;
            justify-content: space-between;
            letter-spacing: 1px;
        }

        .audio-feature .meter {
            height: 6px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(0, 255, 255, 0.1);
        }

        .audio-feature .meter span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.3), rgba(139, 92, 255, 0.7));
            transition: width 0.18s ease;
        }

        #audio-section-status {
            font-size: 11px;
            opacity: 0.65;
            letter-spacing: 1px;
        }

        #audio-bindings {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 160px;
            overflow-y: auto;
        }

        .binding-card {
            padding: 10px;
            border-radius: 10px;
            background: rgba(12, 34, 46, 0.55);
            border: 1px solid rgba(0, 255, 255, 0.18);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 11px;
        }

        .binding-card strong {
            font-size: 12px;
            letter-spacing: 1px;
        }

        .binding-card button {
            border: 1px solid rgba(255, 99, 132, 0.45);
            border-radius: 8px;
            background: rgba(255, 99, 132, 0.12);
            color: #ff9fb3;
            padding: 4px 8px;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #coordinate-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 18px;
        }

        #coordinate-panel h3 {
            font-size: 12px;
            letter-spacing: 1.4px;
            opacity: 0.75;
        }

        #coordinate-spaces {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #coordinate-spaces.empty {
            font-size: 11px;
            opacity: 0.55;
            letter-spacing: 1px;
        }

        .coordinate-card {
            border: 1px solid rgba(0, 255, 255, 0.14);
            border-radius: 12px;
            background: rgba(10, 24, 36, 0.6);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .coordinate-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .coordinate-axis-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .coordinate-axis {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
        }

        .coordinate-axis .axis-title {
            display: flex;
            justify-content: space-between;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .coordinate-axis .axis-value {
            font-size: 14px;
            letter-spacing: 1.2px;
            color: #9cf0ff;
        }

        .coordinate-axis .axis-inputs {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .coordinate-input {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: 0.8px;
            opacity: 0.7;
        }

        .binding-card button:hover {
            background: rgba(255, 99, 132, 0.24);
        }

        #audio-bindings.empty::after {
            content: 'No audio bindings yet. Ask the conductor to map bass, beats, or energy to parameters.';
            font-size: 11px;
            opacity: 0.6;
            line-height: 1.4;
        }

        form#prompt-form {
            display: flex;
            gap: 10px;
        }

        #prompt-input {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: rgba(0, 10, 18, 0.9);
            color: #e6feff;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        #prompt-input:focus {
            outline: none;
            border-color: #8b5cff;
            box-shadow: 0 0 15px rgba(139, 92, 255, 0.35);
        }

        #send-btn {
            background: linear-gradient(135deg, #00faff, #8b5cff);
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #020208;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(0, 250, 255, 0.25);
        }

        #quick-commands {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .quick-btn {
            background: rgba(0, 255, 255, 0.12);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .quick-btn:hover {
            transform: translateY(-1px);
            background: rgba(0, 255, 255, 0.18);
        }

        @media (max-width: 1100px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
                height: auto;
                overflow: auto;
            }

            #visualizer-shell {
                min-height: 320px;
            }
        }
    </style>
</head>
<body>
    <section id="visualizer-shell">
        <div id="visualizer-container">
            <div class="holographic-layers">
                <canvas id="background-canvas"></canvas>
                <canvas id="shadow-canvas"></canvas>
                <canvas id="content-canvas"></canvas>
                <canvas id="highlight-canvas"></canvas>
                <canvas id="accent-canvas"></canvas>
            </div>
        </div>
    </section>
    <section id="console-panel">
        <h1>AI Conductor Console</h1>
        <div id="state-summary"></div>
        <div id="conversation-log"></div>
        <form id="prompt-form">
            <input id="prompt-input" type="text" placeholder="Describe the next move…" autocomplete="off" />
            <button id="send-btn" type="submit">Send</button>
        </form>
        <div id="quick-commands">
            <button class="quick-btn" data-prompt="give me a calm ambient bridge with softer chaos">Calm Bridge</button>
            <button class="quick-btn" data-prompt="push into neon cyberpunk mode and raise speed">Neon Surge</button>
            <button class="quick-btn" data-prompt="prep variation 18 for the drop">Variation 18</button>
            <button class="quick-btn" data-prompt="fade hue from 40 to 300 over 12 seconds">Spectrum Fade</button>
            <button class="quick-btn" data-prompt="let the bass drive grid density and highs shimmer the hue">Audio Grid</button>
        </div>
        <div id="audio-insights">
            <h2>Audio Intelligence</h2>
            <div id="audio-section-status">Upload a track or let the microphone feed drive the choreography.</div>
            <div id="audio-source-tools">
                <label for="audio-upload">Load Track</label>
                <input type="file" id="audio-upload" accept="audio/*">
            </div>
            <audio id="audio-player" controls></audio>
            <div id="audio-features"></div>
            <div id="audio-bindings" class="empty"></div>
            <div id="coordinate-panel">
                <h3>Coordinate Maps</h3>
                <div id="coordinate-spaces" class="empty">No coordinate planes yet. Ask the conductor agent to set one with a coordinate map intent.</div>
            </div>
        </div>
    </section>

    <script type="module">
        import { VIB34DIntegratedEngine } from './src/core/Engine.js';
        import { DynamicControlEngine } from './src/llm/DynamicControlEngine.js';
        import { LLMCommandRouter } from './src/llm/DynamicCommandRouter.js';
        import { LLMAudioChoreographer } from './src/llm/LLMAudioChoreographer.js';

        const engine = new VIB34DIntegratedEngine();
        const dynamicEngine = new DynamicControlEngine(engine);
        const router = new LLMCommandRouter();
        const audioChoreographer = new LLMAudioChoreographer(dynamicEngine);
        dynamicEngine.attachAudioChoreographer(audioChoreographer);

        const conversationLog = document.getElementById('conversation-log');
        const stateSummary = document.getElementById('state-summary');
        const promptForm = document.getElementById('prompt-form');
        const promptInput = document.getElementById('prompt-input');
        const quickButtons = Array.from(document.querySelectorAll('.quick-btn'));
        const audioUpload = document.getElementById('audio-upload');
        const audioPlayer = document.getElementById('audio-player');
        const audioFeatures = document.getElementById('audio-features');
        const audioBindings = document.getElementById('audio-bindings');
        const audioStatus = document.getElementById('audio-section-status');
        const coordinateSpaces = document.getElementById('coordinate-spaces');

        function appendMessage(role, message, meta) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${role}`;
            if (meta) {
                const metaEl = document.createElement('span');
                metaEl.className = 'meta';
                metaEl.textContent = meta;
                wrapper.appendChild(metaEl);
            }
            const textEl = document.createElement('span');
            textEl.textContent = message;
            wrapper.appendChild(textEl);
            conversationLog.appendChild(wrapper);
            conversationLog.scrollTo({ top: conversationLog.scrollHeight, behavior: 'smooth' });
        }

        function formatPercent(value) {
            return `${Math.round(Math.min(Math.max(value, 0), 1) * 100)}%`;
        }

        function renderAudioFeatures(data) {
            if (!data) {
                audioFeatures.innerHTML = '';
                audioStatus.textContent = 'No audio source connected. Use microphone toggle or upload a track to drive choreography.';
                return;
            }

            audioStatus.textContent = `Audio section: ${data.section.toUpperCase()} · confidence ${(data.sectionConfidence * 100).toFixed(0)}%`;

            const featureConfig = [
                ['bass', 'Bass Drive'],
                ['mid', 'Mid Presence'],
                ['high', 'High Spark'],
                ['energy', 'Energy'],
                ['transient', 'Impact'],
                ['beatStrength', 'Beat Pulse'],
            ];

            audioFeatures.innerHTML = '';
            featureConfig.forEach(([key, label]) => {
                const value = data[key] ?? 0;
                const item = document.createElement('div');
                item.className = 'audio-feature';
                const title = document.createElement('div');
                title.className = 'label';
                title.innerHTML = `<span>${label}</span><span>${formatPercent(value)}</span>`;
                const meter = document.createElement('div');
                meter.className = 'meter';
                const fill = document.createElement('span');
                fill.style.width = formatPercent(value);
                meter.appendChild(fill);
                item.appendChild(title);
                item.appendChild(meter);
                audioFeatures.appendChild(item);
            });
        }

        function renderBindings(bindings = []) {
            audioBindings.innerHTML = '';
            if (!bindings.length) {
                audioBindings.classList.add('empty');
                return;
            }
            audioBindings.classList.remove('empty');
            bindings.forEach(binding => {
                const card = document.createElement('div');
                card.className = 'binding-card';
                const details = document.createElement('div');
                details.innerHTML = `<strong>${binding.feature.toUpperCase()} → ${binding.target}</strong><div>mode ${binding.mode} · scale ${binding.scale.toFixed?.(2) ?? binding.scale}</div>`;
                const button = document.createElement('button');
                button.textContent = 'Remove';
                button.addEventListener('click', () => {
                    dynamicEngine.enqueueIntents([{ action: 'removeAudioBinding', bindingId: binding.id }]);
                });
                card.appendChild(details);
                card.appendChild(button);
                audioBindings.appendChild(card);
            });
        }

        function renderCoordinateSpaces(maps = [], projections = []) {
            if (!coordinateSpaces) return;
            coordinateSpaces.innerHTML = '';
            if (!maps || maps.length === 0) {
                coordinateSpaces.classList.add('empty');
                coordinateSpaces.textContent = 'No coordinate planes yet. Ask the conductor agent to set one with a coordinate map intent.';
                return;
            }
            coordinateSpaces.classList.remove('empty');
            const projectionById = new Map((projections || []).map(projection => [projection.id, projection]));
            maps.forEach(map => {
                const projection = projectionById.get(map.id);
                const card = document.createElement('div');
                card.className = 'coordinate-card';

                const header = document.createElement('div');
                header.className = 'coordinate-card-header';
                const title = document.createElement('strong');
                title.textContent = map.id;
                const timestamp = document.createElement('span');
                timestamp.textContent = map.updatedAt ? new Date(map.updatedAt).toLocaleTimeString() : '';
                header.appendChild(title);
                header.appendChild(timestamp);
                card.appendChild(header);

                const axesGrid = document.createElement('div');
                axesGrid.className = 'coordinate-axis-grid';
                ['x', 'y'].forEach(axisKey => {
                    const axisConfig = map.axes?.[axisKey];
                    if (!axisConfig) return;
                    const axisProjection = projection?.axes?.[axisKey];
                    const axisEl = document.createElement('div');
                    axisEl.className = 'coordinate-axis';
                    const axisTitle = document.createElement('div');
                    axisTitle.className = 'axis-title';
                    axisTitle.innerHTML = `<span>${axisKey.toUpperCase()} Axis${axisConfig.label ? ` · ${axisConfig.label}` : ''}</span><span>${axisConfig.normalize ? 'normalized' : ''}</span>`;
                    axisEl.appendChild(axisTitle);

                    const axisValue = document.createElement('div');
                    axisValue.className = 'axis-value';
                    const value = axisProjection?.value ?? axisConfig.bias ?? 0;
                    axisValue.textContent = value.toFixed(2);
                    axisEl.appendChild(axisValue);

                    const inputsWrapper = document.createElement('div');
                    inputsWrapper.className = 'axis-inputs';
                    axisConfig.inputs.forEach(input => {
                        const inputRow = document.createElement('div');
                        inputRow.className = 'coordinate-input';
                        const reference = input.source === 'audio' ? (input.feature?.toUpperCase?.() ?? 'AUDIO') : input.target;
                        const summary = axisProjection?.inputs?.find(item => (input.source === 'audio' ? item.reference === input.feature : item.reference === input.target));
                        const sample = summary?.sample ?? 0;
                        inputRow.innerHTML = `<span>${input.source === 'audio' ? '🎵' : '🎛️'} ${reference}</span><span>${(input.weight ?? 1).toFixed(2)}× ${input.transform}${summary ? ` · ${sample.toFixed(2)}` : ''}</span>`;
                        inputsWrapper.appendChild(inputRow);
                    });
                    axisEl.appendChild(inputsWrapper);
                    axesGrid.appendChild(axisEl);
                });
                card.appendChild(axesGrid);
                coordinateSpaces.appendChild(card);
            });
        }

        function renderState(snapshot) {
            stateSummary.innerHTML = '';
            const entries = [
                ['Variation', `#${snapshot.variation + 1}`],
                ['Chaos', snapshot.parameters.chaos.toFixed(2)],
                ['Speed', snapshot.parameters.speed.toFixed(2)],
                ['Hue', `${Math.round(snapshot.parameters.hue)}°`],
                ['Intensity', snapshot.parameters.intensity.toFixed(2)],
                ['Saturation', snapshot.parameters.saturation.toFixed(2)],
                ['Morph', snapshot.parameters.morphFactor.toFixed(2)],
                ['Grid', snapshot.parameters.gridDensity.toFixed(1)],
            ];

            entries.forEach(([label, value]) => {
                const chip = document.createElement('div');
                chip.className = 'state-chip';
                const title = document.createElement('span');
                title.textContent = label;
                const valueEl = document.createElement('span');
                valueEl.className = 'value';
                valueEl.textContent = value;
                chip.appendChild(title);
                chip.appendChild(valueEl);
                stateSummary.appendChild(chip);
            });

            if (snapshot.envelopes.length) {
                const envelopeChip = document.createElement('div');
                envelopeChip.className = 'state-chip';
                envelopeChip.innerHTML = '<strong>Envelopes</strong>';
                snapshot.envelopes.forEach(env => {
                    const item = document.createElement('div');
                    item.style.fontSize = '11px';
                    item.textContent = `${env.target} → ${env.remaining.toFixed(1)}s (${env.easing})`;
                    envelopeChip.appendChild(item);
                });
                stateSummary.appendChild(envelopeChip);
            }

            if (snapshot.audio) {
                renderAudioFeatures(snapshot.audio.features);
                renderBindings(snapshot.audio.bindings);
            } else {
                renderAudioFeatures(null);
                renderBindings([]);
            }
            renderCoordinateSpaces(snapshot.coordinateMaps, snapshot.audio?.projections ?? []);
        }

        dynamicEngine.on('state', renderState);
        dynamicEngine.on('log', entry => {
            if (entry.level === 'debug') return;
            appendMessage('system', entry.message, entry.level.toUpperCase());
        });

        promptForm.addEventListener('submit', event => {
            event.preventDefault();
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt, 'PROMPT');
            promptInput.value = '';

            const { intents, summary } = router.processPrompt(prompt);
            if (summary) {
                appendMessage('system', summary, 'ROUTER');
            }

            const { results } = dynamicEngine.enqueueIntents(intents, { prompt });
            results
                .filter(result => result.message)
                .forEach(result => {
                    appendMessage('system', result.message, (result.status || 'INFO').toUpperCase());
                });
        });

        quickButtons.forEach(button => {
            button.addEventListener('click', () => {
                promptInput.value = button.dataset.prompt;
                promptForm.requestSubmit();
            });
        });

        audioUpload.addEventListener('change', async event => {
            const [file] = event.target.files;
            if (!file) return;
            appendMessage('system', `Loading ${file.name} for analysis...`, 'AUDIO');
            try {
                await audioChoreographer.loadFile(file, audioPlayer);
                appendMessage('system', `${file.name} ready. Describe how to choreograph with it.`, 'AUDIO');
            } catch (error) {
                console.error('Audio load failed', error);
                appendMessage('system', `Audio load failed: ${error.message}`, 'ERROR');
            }
        });

        audioChoreographer.on('features', renderAudioFeatures);
        audioChoreographer.on('bindings', renderBindings);

        appendMessage('system', 'AI Conductor ready. Describe a visual move to begin.', 'STATUS');
        renderState(dynamicEngine.getStateSnapshot());
    </script>
</body>
</html>
